name: Update Dashboard Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data from Google Drive
        run: |
          FILE_ID="1XF4p_2OrTKvNQEf6D6jFs0KKK_R0TJYn"
          # Use usercontent.google.com which bypasses the virus-scan confirmation page
          curl -L "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o data_new.json \
            --fail \
            --silent \
            --show-error
          # Validate JSON - if invalid keep existing data.json and exit success
          if python3 -c "import json; json.load(open('data_new.json'))" 2>/dev/null; then
            mv data_new.json data.json
          else
            echo "WARNING: Downloaded content is not valid JSON - keeping existing data.json"
            cat data_new.json | head -c 500
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "action@github.com"
          cp data.json /tmp/data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/data.json data.json
          git add data.json
          git commit -m "Dashboard update $(date -u '+%d/%m/%Y %H:%M')" --allow-empty
          git push
