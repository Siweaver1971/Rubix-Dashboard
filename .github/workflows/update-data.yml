name: Update Dashboard Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data from Google Drive
        run: |
          FILE_ID="1XF4p_2OrTKvNQEf6D6jFs0KKK_R0TJYn"
          curl -L "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o data_new.json \
            --fail \
            --silent \
            --show-error

      - name: Sanitise and validate JSON
        run: |
          python3 -c "
import json, sys
raw = open('data_new.json', 'r', encoding='utf-8').read()
raw = raw.replace('\u00a0', ' ')
try:
    data = json.loads(raw)
except Exception as e:
    print('INVALID JSON:', e)
    sys.exit(1)
if 'message' in data and data['message']:
    msg = data['message']
    msg = msg.replace('\u00a0', ' ').replace('\u201c', '\"').replace('\u201d', '\"')
    msg = msg.replace('\u2018', \"'\").replace('\u2019', \"'\").strip()
    data['message'] = msg
out = json.dumps(data, ensure_ascii=False)
json.loads(out)
open('data.json', 'w', encoding='utf-8').write(out)
print('JSON OK')
"

      - name: Commit and push if changed
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "action@github.com"
          cp data.json /tmp/data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/data.json data.json
          git add data.json
          git commit -m "Dashboard update $(date -u '+%d/%m/%Y %H:%M')" --allow-empty
          git push
