name: Update Dashboard Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data from Google Drive
        run: |
          FILE_ID="1XF4p_2OrTKvNQEf6D6jFs0KKK_R0TJYn"
          curl -L "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o data_new.json \
            --fail \
            --silent \
            --show-error
          # Fix JSON: sanitise message field to remove unescaped quotes and non-breaking spaces
          python3 - <<'EOF'
import json, re, sys

raw = open('data_new.json', 'r', encoding='utf-8').read()

try:
    data = json.loads(raw)
except json.JSONDecodeError as e:
    print(f"Raw JSON invalid: {e}")
    # Try to fix common issues: non-breaking spaces (0xa0) and unescaped quotes in message
    raw_fixed = raw.replace('\u00a0', ' ')  # Replace non-breaking spaces
    try:
        data = json.loads(raw_fixed)
        print("Fixed by replacing non-breaking spaces")
    except json.JSONDecodeError as e2:
        print(f"Still invalid after fix: {e2}")
        sys.exit(1)

# Sanitise the message field specifically
if 'message' in data and data['message']:
    msg = data['message']
    # Replace non-breaking spaces with regular spaces
    msg = msg.replace('\u00a0', ' ')
    # Replace curly/smart quotes with straight equivalents
    msg = msg.replace('\u201c', '"').replace('\u201d', '"')
    msg = msg.replace('\u2018', "'").replace('\u2019', "'")
    # Strip leading/trailing whitespace
    msg = msg.strip()
    data['message'] = msg

out = json.dumps(data, ensure_ascii=False)
# Validate output is good JSON
json.loads(out)
open('data_new.json', 'w', encoding='utf-8').write(out)
print("JSON sanitised and validated OK")
EOF
          mv data_new.json data.json

      - name: Commit and push if changed
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "action@github.com"
          cp data.json /tmp/data.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/data.json data.json
          git add data.json
          git commit -m "Dashboard update $(date -u '+%d/%m/%Y %H:%M')" --allow-empty
          git push
